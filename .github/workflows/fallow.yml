name: Fallow code quality

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Fallow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code quality
        uses: fallow-rs/fallow@71369f80d099e25726ad04382f15aef14a251abc # v3.31.0
        with:
          command: audit
          version: 3.31.0
          config: .fallowrc.json
          format: human
          fail-on-issues: true
          annotations: true
          changed-since: >-
            ${{ github.event.pull_request.base.sha ||
                (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) ||
                format('origin/{0}', github.event.repository.default_branch) }}
