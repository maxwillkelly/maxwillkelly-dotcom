name: Check Linear release automation

on:
  pull_request:
    paths:
      - .github/scripts/prepare-linear-release*
      - .github/workflows/linear-release*.yml
  push:
    paths:
      - .github/scripts/prepare-linear-release*
      - .github/workflows/linear-release*.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test release ranges, versions, notes, and retries
        run: node --test .github/scripts/prepare-linear-release.test.mjs
