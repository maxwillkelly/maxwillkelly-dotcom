name: Sync Linear release

on:
  repository_dispatch:
    types: [vercel.deployment.promoted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linear-release-production
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.git.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: v0.1.${{ github.run_number }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync Linear release
        uses: linear/linear-release-action@3858a5d7892435dc63302ac76b0cdb587435caa9 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: Release ${{ env.RELEASE_VERSION }}
          version: ${{ env.RELEASE_VERSION }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Complete Linear release
        if: github.event_name == 'repository_dispatch'
        uses: linear/linear-release-action@3858a5d7892435dc63302ac76b0cdb587435caa9 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ env.RELEASE_VERSION }}
