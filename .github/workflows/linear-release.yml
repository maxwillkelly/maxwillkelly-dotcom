name: Sync Linear release

on:
  repository_dispatch:
    types:
      - vercel.deployment.promoted
  workflow_dispatch:

permissions:
  contents: write # Record successful releases with production version tags.

concurrency:
  group: linear-release-production
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # Last commit already synced into the existing, unversioned Linear release.
      LINEAR_RELEASE_INITIAL_SHA: fd88ea599e9eb6ebb8593b97917f857d6622cf7a

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify production commit
        if: github.event_name == 'repository_dispatch'
        env:
          DEPLOYMENT_SHA: ${{ github.event.client_payload.git.sha }}
        run: |
          if [[ ! "$DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Promotion event must contain a full deployment commit SHA.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main

      - name: Check release baseline and retry state
        id: prepare
        run: node .github/scripts/prepare-linear-release.mjs

      - name: Calculate next patch version
        id: bump
        if: steps.prepare.outputs.publish == 'true' && steps.prepare.outputs.version == ''
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ github.token }}
          tag_prefix: production/v
          prefix_match_tag: true
          previous_tag: ${{ steps.prepare.outputs.base }}
          previous_version: ${{ steps.prepare.outputs.previous_version }}
          force_bump: patch
          commit_sha: ${{ steps.prepare.outputs.sha }}
          ref: refs/heads/main
          dry_run: true

      - name: Select release version
        id: version
        env:
          VERSION: ${{ steps.prepare.outputs.version || steps.bump.outputs.new_version }}
          PUBLISH: ${{ steps.prepare.outputs.publish }}
        run: |
          if [[ "$PUBLISH" == true && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Versioning action must return a stable semantic version.' >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Proposed release version: ${VERSION:-no new release}" >> "$GITHUB_STEP_SUMMARY"

      - name: Reserve version for this production commit
        if: github.event_name == 'repository_dispatch' && steps.prepare.outputs.publish == 'true' && steps.prepare.outputs.reserve == 'true'
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ github.token }}
          tag_prefix: production-reserved/v
          custom_tag: ${{ steps.version.outputs.value }}
          commit_sha: ${{ steps.prepare.outputs.sha }}
          ref: refs/heads/main

      - name: Sync Linear release
        if: steps.prepare.outputs.publish == 'true'
        uses: linear/linear-release-action@3858a5d7892435dc63302ac76b0cdb587435caa9 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: Release v${{ steps.version.outputs.value }}
          version: v${{ steps.version.outputs.value }}
          base_ref: ${{ steps.prepare.outputs.base }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Complete Linear release
        if: github.event_name == 'repository_dispatch' && steps.prepare.outputs.publish == 'true'
        uses: linear/linear-release-action@3858a5d7892435dc63302ac76b0cdb587435caa9 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: v${{ steps.version.outputs.value }}

      - name: Record successful release version
        if: github.event_name == 'repository_dispatch' && steps.prepare.outputs.publish == 'true'
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ github.token }}
          tag_prefix: production/v
          custom_tag: ${{ steps.version.outputs.value }}
          commit_sha: ${{ steps.prepare.outputs.sha }}
          ref: refs/heads/main
